<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Vendas - Ingressos</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      
      /* IMPORTANTE: Substitua 'background.png' pelo nome exato da sua imagem (respeite maiúsculas e minúsculas) */
      background-image: url('background.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;
      background-color: #f4f6f9; /* Cor de fundo alternativa */
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent; /* Permite ver o fundo através do iframe */
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbzEB5wUat_5Gs35OeuidoxUN4bzYlwzvXHJDLCTeYLFVDucw04LzUIXGcZqMJ8-EzA9/exec" 
    allow="clipboard-write"
    allowtransparency="true">
  </iframe>
</body>
</html>
